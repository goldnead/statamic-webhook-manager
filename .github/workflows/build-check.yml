name: build-check

# Two things about the CP bundle:
#
#   1. resources/dist is committed and shipped via Composer (no npm at install
#      time), so it must always match current source. See
#      scripts/check-dist-fresh.sh.
#   2. The Vitest suite exists and, until now, never ran anywhere but on a
#      developer's machine. Node is already set up in this job.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  dist-fresh:
    runs-on: ubuntu-latest
    name: Committed dist is fresh, JS suite is green
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      # @statamic/cms is a `file:` npm dependency resolved from the installed
      # Composer package, so Composer must run before npm.
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # --ignore-scripts: nothing in this dependency tree needs a postinstall,
      # and a lifecycle script is the cheapest supply-chain foothold there is.
      - name: Install Node dependencies (reproducible)
        run: npm ci --ignore-scripts

      - name: Run the Vitest suite
        run: npm test

      - name: Verify committed resources/dist is fresh
        run: npm run build:check
